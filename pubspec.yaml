name: diaspo_niger
description: "Niger Diaspora - Plateforme mobile de mise en relation de la diaspora nigerienne"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+4

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  tutorial_coach_mark: ^1.2.11

  # Maps
  google_maps_flutter: ^2.9.0
  google_maps_flutter_android: ^2.14.0
  google_maps_flutter_platform_interface: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Utils
  go_router: ^14.6.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  intl: ^0.19.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Image & Files
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.0.0
  url_launcher: ^6.2.5

  # Calendar
  add_2_calendar: ^3.0.1

  # Social Share
  share_plus: ^10.1.4

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Phone Number
  intl_phone_field: ^3.2.0

  # Auth
  google_sign_in: ^6.2.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  firebase_database: ^11.3.10
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

  # Linting
  flutter_lints: ^5.0.0

  # Testing
  mockito: ^5.4.4
  fake_cloud_firestore: ^3.0.3

  # App Icons
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/import_icons/nd_ultra_minimal_icon.png"

  # Android Adaptive Icons
  adaptive_icon_background: "#E97424"
  adaptive_icon_foreground: "assets/import_icons/nd_adaptive_foreground_xxxhdpi.png"

  # iOS specific
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
