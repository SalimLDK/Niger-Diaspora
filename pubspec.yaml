name: diaspo_niger
description: "Diaspo Niger - Plateforme mobile de mise en relation de la diaspora nigerienne"
publish_to: 'none'
version: 1.2.0+10

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+4
  cloud_functions: ^5.1.3
  firebase_analytics:
  firebase_crashlytics:
  firebase_performance:

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  tutorial_coach_mark: ^1.2.11
  carousel_slider: ^5.0.0
  photo_view: ^0.15.0

  # Maps
  google_maps_flutter: ^2.9.0
  google_maps_flutter_android: ^2.14.0
  google_maps_flutter_platform_interface: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # Ads
  google_mobile_ads: ^5.2.0

  # Emoji picker
  emoji_picker_flutter: ^3.1.0

  # Utils
  go_router: ^14.6.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  rxdart: ^0.28.0
  intl: ^0.20.2
  timeago: ^3.7.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Image & Files
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  photo_manager: ^3.6.4
  photo_manager_image_provider: ^2.2.0
  pro_image_editor: ^9.0.0
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.0.0
  url_launcher: ^6.2.5

  # Calendar
  add_2_calendar: ^3.0.1

  # Social Share
  share_plus: ^11.0.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Phone Number
  intl_phone_field: ^3.2.0

  # Auth
  google_sign_in: ^7.1.0
  sign_in_with_apple: ^6.1.4
  country_picker: ^2.0.26

  # Networking
  dio: ^5.7.0
  http: ^1.2.0
  connectivity_plus: ^6.1.0
  firebase_database: ^11.3.10
  flutter_local_notifications: ^19.5.0

  # Audio
  record: ^5.0.5
  just_audio: ^0.9.37
  audio_waveforms: ^1.0.5

  # Download to Gallery
  gal: ^2.3.0

  # Payments & Monetization
  flutter_stripe: ^11.4.0
  purchases_flutter: ^10.10.1
  uuid: ^4.2.1
  firebase_remote_config: ^5.5.0
  flutter_background_service: ^5.1.0
  timezone: ^0.10.1
  encrypt: ^5.0.3

  # Backend
  supabase_flutter: ^2.8.0

  # Sharing intent
  receive_sharing_intent: 1.8.1

  # Crypto
  cryptography: ^2.7.0

  # Media processing
  blurhash_dart: ^1.2.1
  image: ^4.5.0
  video_thumbnail: ^0.5.3

  # WebRTC
  flutter_webrtc: ^0.12.12

  # Environment config
  flutter_dotenv: ^5.2.1

  # Audio service / background playback
  audio_service: ^0.18.16
  audio_session: ^0.1.25

  # CallKit
  flutter_callkit_incoming: ^2.5.0

  # Wakelock
  wakelock_plus: ^1.2.10

  # LiveKit calls
  livekit_client: ^2.4.0

  # App badge
  app_badge_plus: ^1.1.6

  # HTML parsing
  html: ^0.15.6

  # Device info
  device_info_plus: ^11.4.0

  # Version de l'app (affichée dans Réglages et Profil, jointe aux tickets
  # de support). Déjà présente en dépendance transitive : la déclarer permet
  # de l'importer sans dépendre d'un paquet non listé.
  package_info_plus: ^9.0.1

  # Crypto utilities
  crypto: ^3.0.6

  # Ringtone
  flutter_ringtone_player: ^4.0.0

  # Video
  video_player: ^2.9.5
  video_compress: ^3.1.4
  visibility_detector: ^0.4.0
  app_tracking_transparency: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

  # Linting
  flutter_lints: ^5.0.0

  # Testing
  mockito: ^5.4.4
  fake_cloud_firestore: ^3.0.3

  # App Icons
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/import_icons/dn_ultra_minimal_icon.png"
  min_sdk_android: 21

  # Android Adaptive Icons
  adaptive_icon_background: "#E97424"
  adaptive_icon_foreground: "assets/import_icons/dn_adaptive_foreground_xxxhdpi.png"

  # iOS specific
  remove_alpha_ios: true

  # Web favicon (optionnel)
  web:
    generate: true
    image_path: "assets/import_icons/dn_ultra_minimal_icon.png"
    background_color: "#E97424"
    theme_color: "#E97424"

  # Windows (optionnel)
  windows:
    generate: true
    image_path: "assets/import_icons/dn_ultra_minimal_icon.png"
    icon_size: 48

dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    # Styles Google Maps clair/sombre (fiches 7d et 8b). Sans cette
    # déclaration, `GoogleMap.style` reste nul et la carte garde le rendu
    # Google par défaut — clair, même en thème nocturne.
    - assets/map_styles/

