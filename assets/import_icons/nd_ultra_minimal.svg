<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ultraOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E97424;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59942;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond orange avec coins arrondis -->
  <rect width="200" height="200" rx="44" fill="url(#ultraOrange)"/>
  
  <!-- Texte ND avec police stylisée et très grasse -->
  <text x="100" y="130" 
        font-family="'Arial Black', 'Arial Bold', 'Helvetica Bold', sans-serif" 
        font-size="95" 
        font-weight="900" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="2">ND</text>
</svg>
